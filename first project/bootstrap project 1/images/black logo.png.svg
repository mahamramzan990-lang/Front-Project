<svg width="260" height="60" viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mark { font-family: 'Consolas', 'Menlo', monospace; font-weight: 700; }
      .word { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .sub  { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- angle bracket mark -->
  <g class="mark" fill="#3DD6C4">
    <text x="0" y="42" font-size="34">&lt;</text>
  </g>

  <!-- AM -->
  <text x="22" y="40" class="word" font-size="28" fill="#111111" letter-spacing="0.5">AM</text>

  <!-- closing slash bracket -->
  <g class="mark" fill="#3DD6C4">
    <text x="86" y="42" font-size="34">/&gt;</text>
  </g>

  <!-- vertical divider -->
  <rect x="126" y="14" width="2" height="30" fill="#3DD6C4" opacity="0.5"/>

  <!-- Coder -->
  <text x="138" y="40" class="sub" font-size="26" fill="#111111">Coder</text>

  <!-- blinking cursor accent -->
  <rect x="252" y="16" width="6" height="26" fill="#3DD6C4"/>
</svg>
